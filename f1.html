                <p class="jp">メイン</p>

            </div>
            <ul class="dishes">
                <li class="dish">
                    <h3>陶板菲力牛排</h3>

                </li>
                <li class="dish">

                <li class="dish">
                    <h3>海陸雙饗</h3>
                    <p>菲力牛排搭配奶油干貝</p>
                </li>
                <li class="dish">
                    <h3>嫩煎鮭魚排</h3>
                    <p>挪威鮭魚，佐柚香奶油醬</p>
                </li>
                <li class="dish">
                    <h3>照燒雞腿排</h3>
                    <p>去骨雞腿，甜鹹照燒醬汁</p>
                </li>
                <li class="dish">
                    <h3>味噌豬里肌</h3>
                    <p>西京味噌醃漬，香煎上色</p>
                </li>
